name: Town Hall Third Column Autograder

on:
push:
workflow_dispatch:

jobs:

grade:

```
runs-on: ubuntu-latest

steps:

  - name: Checkout Student Submission
    uses: actions/checkout@v4

  - name: Display Repository Files
    run: |
      echo "Repository contents:"
      find . -maxdepth 3 -type f

  - name: Check Required Files
    run: |
      test -f index.html
      test -f styles/Ex10_main.css
      test -f test.sh

  - name: Fix Windows Line Endings
    run: |
      sed -i 's/\r$//' test.sh

  - name: Run Autograder
    run: |
      bash test.sh
```
